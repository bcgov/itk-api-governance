# Title: SDX API Standard Ruleset
# This Spectral ruleset enforces the mandatory OpenAPI validation requirements
# for APIs published through Secure Data Exchange (SDX).
#
# It extends the [Basic OpenAPI Style Guide](basic-style-guide.md), escalates SDX-mandatory Basic
# warnings to errors, and adds SDX-specific gateway authorization and internal
# transport rules.
extends: ./basic-ruleset.yaml

functions:
  - sdx-no-internal-headers
  - sdx-oauth2-scope-descriptions-consistent
  - sdx-oauth2-security-schemes
  - sdx-operation-security-scopes

rules:
  # Section: SDX Mandatory Basic Rules
  # SDX provisioning requires these Basic rules to pass with zero errors.

  # SDX accepts OpenAPI 3.x contracts only. Swagger 2.0 is not supported.
  #
  # See [Basic Style Guide](basic-style-guide.md#oas2-require-openapi-3)
  oas2-require-openapi-3: error

  # Every operation must have an operationId.
  #
  # See [Basic Style Guide](basic-style-guide.md#operation-operationId)
  operation-operationId: error

  # Descriptions and examples must not include unsafe eval() JavaScript.
  #
  # See [Basic Style Guide](basic-style-guide.md#no-eval-in-markdown)
  no-eval-in-markdown: error

  # Descriptions and examples must not include script tags.
  #
  # See [Basic Style Guide](basic-style-guide.md#no-script-tags-in-markdown)
  no-script-tags-in-markdown: error

  # OpenAPI 3 media examples must validate against their schemas.
  #
  # See [Basic Style Guide](basic-style-guide.md#oas3-valid-media-example)
  oas3-valid-media-example: error

  # OpenAPI 3 schema examples must validate against their schemas.
  #
  # See [Basic Style Guide](basic-style-guide.md#oas3-valid-schema-example)
  oas3-valid-schema-example: error

  # Section: SDX Gateway Authorization

  # SDX Gateway authorization must be documented with at least one OAuth2
  # security scheme because the API contract must explicitly define the relevant
  # gateway scopes. OpenID Connect schemes SHOULD NOT be used for SDX Gateway
  # authorization, but may be present when they use the same identity provider as
  # the SDX OAuth2 security scheme and do not conflict with the OAuth2 API
  # contract.
  #
  # Valid example:
  # ```yaml
  # components:
  #   securitySchemes:
  #     sdxOAuth2:
  #       type: oauth2
  #       flows:
  #         clientCredentials:
  #           tokenUrl: https://sso.example.gov.bc.ca/oauth2/token
  #           scopes:
  #             loads:read: Read load records.
  #     sdxOidc:
  #       type: openIdConnect
  #       openIdConnectUrl: https://sso.example.gov.bc.ca/.well-known/openid-configuration
  # ```
  #
  # Invalid example:
  # ```yaml
  # components:
  #   securitySchemes:
  #     sdxOidc:
  #       type: openIdConnect
  #       openIdConnectUrl: https://other-sso.example.gov.bc.ca/.well-known/openid-configuration
  #     sdxOAuth2:
  #       type: oauth2
  #       flows:
  #         clientCredentials:
  #           tokenUrl: https://sso.example.gov.bc.ca/oauth2/token
  #           scopes: {}
  # ```
  sdx-oauth2-security-schemes:
    description: SDX security schemes must include OAuth2 schemes with complete flow metadata, and OpenID Connect schemes must not conflict with the OAuth2 identity provider.
    message: "{{error}}"
    severity: error
    formats: [oas3]
    given: $.components.securitySchemes
    then:
      function: sdx-oauth2-security-schemes

  # A scope declared under more than one OAuth2 flow must use the same description
  # in each flow.
  #
  # Valid example:
  # ```yaml
  # components:
  #   securitySchemes:
  #     sdxOAuth2:
  #       type: oauth2
  #       flows:
  #         authorizationCode:
  #           authorizationUrl: https://sso.example.gov.bc.ca/oauth2/authorize
  #           tokenUrl: https://sso.example.gov.bc.ca/oauth2/token
  #           scopes:
  #             loads:read: Read load records.
  #         clientCredentials:
  #           tokenUrl: https://sso.example.gov.bc.ca/oauth2/token
  #           scopes:
  #             loads:read: Read load records.
  # ```
  #
  # Invalid example:
  # ```yaml
  # components:
  #   securitySchemes:
  #     sdxOAuth2:
  #       type: oauth2
  #       flows:
  #         authorizationCode:
  #           authorizationUrl: https://sso.example.gov.bc.ca/oauth2/authorize
  #           tokenUrl: https://sso.example.gov.bc.ca/oauth2/token
  #           scopes:
  #             loads:read: Read load records.
  #         clientCredentials:
  #           tokenUrl: https://sso.example.gov.bc.ca/oauth2/token
  #           scopes:
  #             loads:read: Read load summaries.
  # ```
  sdx-oauth2-scope-descriptions-consistent:
    description: OAuth2 scope descriptions must be consistent across flows.
    message: "{{error}}"
    severity: error
    formats: [oas3]
    given: $.components.securitySchemes
    then:
      function: sdx-oauth2-scope-descriptions-consistent

  # Each operation must have effective security that includes the SDX OAuth2
  # scheme. Operations may inherit global security from the document root. When
  # an operation declares local security, that local declaration overrides global
  # security and must still include SDX OAuth2.
  #
  # Valid example:
  # ```yaml
  # security:
  #   - sdxOAuth2:
  #       - loads:read
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  # components:
  #   securitySchemes:
  #     sdxOAuth2:
  #       type: oauth2
  #       flows:
  #         clientCredentials:
  #           tokenUrl: https://sso.example.gov.bc.ca/oauth2/token
  #           scopes:
  #             loads:read: Read load records.
  # ```
  #
  # Invalid example:
  # ```yaml
  # security:
  #   - sdxOAuth2:
  #       - loads:read
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       security:
  #         - providerApiKey: []
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  # components:
  #   securitySchemes:
  #     sdxOAuth2:
  #       type: oauth2
  #       flows:
  #         clientCredentials:
  #           tokenUrl: https://sso.example.gov.bc.ca/oauth2/token
  #           scopes:
  #             loads:read: Read load records.
  #     providerApiKey:
  #       type: apiKey
  #       in: header
  #       name: X-Provider-Key
  # ```
  sdx-operation-security-scopes:
    description: Every operation security option must include an SDX OAuth2 scheme.
    message: "{{error}}"
    severity: error
    formats: [oas3]
    given: $.paths
    then:
      function: sdx-operation-security-scopes

  # Section: SDX Internal Transport

  # External API contracts must not expose SDX internal edge headers, including
  # X-Edge-Token and other X-Edge-* headers.
  #
  # Valid example:
  # ```yaml
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       parameters:
  #         - name: X-Correlation-ID
  #           in: header
  #           schema:
  #             type: string
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  # ```
  #
  # Invalid example:
  # ```yaml
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       parameters:
  #         - name: X-Edge-Token
  #           in: header
  #           schema:
  #             type: string
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  #           headers:
  #             X-Edge-Trace:
  #               description: Internal trace header.
  #               schema:
  #                 type: string
  # ```
  sdx-no-internal-headers:
    description: External API contracts must not expose SDX internal transport headers.
    message: "{{error}}"
    severity: error
    formats: [oas3]
    given: $
    then:
      function: sdx-no-internal-headers

  # Section: SDX Unsupported OpenAPI Features

  # SDX does not support OpenAPI 3.1 webhooks.
  #
  # Valid example:
  # ```yaml
  # openapi: 3.1.0
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  # ```
  #
  # Invalid example:
  # ```yaml
  # openapi: 3.1.0
  # webhooks:
  #   loadChanged:
  #     post:
  #       operationId: loadChanged
  #       responses:
  #         '202':
  #           description: Load change accepted.
  # ```
  sdx-no-webhooks:
    description: SDX API contracts must not define OpenAPI webhooks.
    message: Document defines OpenAPI webhooks unsupported by SDX.
    severity: error
    formats: [oas3]
    given: $.webhooks
    then:
      function: falsy

  # SDX does not support OpenAPI callbacks.
  #
  # Valid example:
  # ```yaml
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  # ```
  #
  # Invalid example:
  # ```yaml
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       callbacks:
  #         onLoadChanged:
  #           '{$request.body#/callbackUrl}':
  #             post:
  #               operationId: onLoadChanged
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  # ```
  sdx-no-callbacks:
    description: SDX API contracts must not define OpenAPI callbacks.
    message: Operation defines OpenAPI callbacks unsupported by SDX.
    severity: error
    formats: [oas3]
    given: $.paths[*][*].callbacks
    then:
      function: falsy

  # SDX does not support long-lived streaming media types.
  #
  # Valid example:
  # ```yaml
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  #           content:
  #             application/json:
  #               schema:
  #                 type: object
  # ```
  #
  # Invalid example:
  # ```yaml
  # paths:
  #   /loads:
  #     get:
  #       operationId: streamLoads
  #       responses:
  #         '200':
  #           description: Loads streamed successfully.
  #           content:
  #             text/event-stream:
  #               schema:
  #                 type: string
  # ```
  sdx-no-streaming-media-types:
    description: SDX API contracts must not define streaming media types.
    message: Request or response defines a streaming media type unsupported by SDX.
    severity: error
    formats: [oas3]
    given:
      - $.paths[*][*].requestBody.content
      - $.paths[*][*].responses[*].content
      - $.components.requestBodies.*.content
      - $.components.responses.*.content
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          propertyNames:
            not:
              pattern: "^(text/event-stream|application/x-ndjson|application/stream\\+json|application/json-seq)$"

  # SDX does not support WebSocket server URLs.
  #
  # Valid example:
  # ```yaml
  # servers:
  #   - url: https://api.example.gov.bc.ca/sdx
  # ```
  #
  # Invalid example:
  # ```yaml
  # servers:
  #   - url: wss://api.example.gov.bc.ca/sdx
  # ```
  sdx-no-websocket-server-urls:
    description: SDX API contracts must not define WebSocket server URLs.
    message: Server URL uses a WebSocket scheme unsupported by SDX.
    severity: error
    formats: [oas3]
    given: $..servers[*].url
    then:
      function: pattern
      functionOptions:
        notMatch: "^wss?://"

  # SDX can only proxy HTTP, HTTPS, or relative server URLs.
  #
  # Valid example:
  # ```yaml
  # servers:
  #   - url: /mass-haul
  # ```
  #
  # Invalid example:
  # ```yaml
  # servers:
  #   - url: ftp://api.example.gov.bc.ca/mass-haul
  # ```
  sdx-server-urls-http-only:
    description: SDX API contracts must only define HTTP, HTTPS, or relative server URLs.
    message: Server URL uses a scheme unsupported by SDX.
    severity: error
    formats: [oas3]
    given: $..servers[*].url
    then:
      function: pattern
      functionOptions:
        match: "^(https?://|/|wss?://)"

  # SDX routing is controlled centrally and does not support operation-level
  # server overrides.
  #
  # Valid example:
  # ```yaml
  # servers:
  #   - url: https://api.example.gov.bc.ca/sdx
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  # ```
  #
  # Invalid example:
  # ```yaml
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       servers:
  #         - url: https://operation.example.gov.bc.ca/sdx
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  # ```
  sdx-no-operation-servers:
    description: SDX API contracts must not define operation-level servers.
    message: Operation defines a server override unsupported by SDX.
    severity: error
    formats: [oas3]
    given: $.paths[*][*].servers
    then:
      function: falsy

  # SDX routing is controlled centrally and does not support path-item-level
  # server overrides.
  #
  # Valid example:
  # ```yaml
  # servers:
  #   - url: https://api.example.gov.bc.ca/sdx
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  # ```
  #
  # Invalid example:
  # ```yaml
  # paths:
  #   /loads:
  #     servers:
  #       - url: https://path.example.gov.bc.ca/sdx
  #     get:
  #       operationId: listLoads
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  # ```
  sdx-no-path-item-servers:
    description: SDX API contracts must not define path-item-level servers.
    message: Path item defines a server override unsupported by SDX.
    severity: error
    formats: [oas3]
    given: $.paths[*].servers
    then:
      function: falsy

  # SDX does not support TRACE, OPTIONS, or HEAD operations.
  #
  # Valid example:
  # ```yaml
  # paths:
  #   /loads:
  #     get:
  #       operationId: listLoads
  #       responses:
  #         '200':
  #           description: Loads returned successfully.
  # ```
  #
  # Invalid example:
  # ```yaml
  # paths:
  #   /loads:
  #     trace:
  #       operationId: traceLoads
  #       responses:
  #         '204':
  #           description: Trace completed successfully.
  # ```
  sdx-supported-http-methods:
    description: SDX API contracts must only define supported HTTP operations.
    message: Operation uses an HTTP method unsupported by SDX.
    severity: error
    formats: [oas3]
    given:
      - $.paths[*].trace
      - $.paths[*].options
      - $.paths[*].head
    then:
      function: falsy

  # SDX does not support cookie-based API contracts.
  #
  # Valid example:
  # ```yaml
  # parameters:
  #   - name: requestId
  #     in: header
  #     schema:
  #       type: string
  # ```
  #
  # Invalid example:
  # ```yaml
  # parameters:
  #   - name: session
  #     in: cookie
  #     schema:
  #       type: string
  # ```
  sdx-no-cookie-parameters:
    description: SDX API contracts must not define cookie parameters.
    message: Parameter uses cookie location unsupported by SDX.
    severity: error
    formats: [oas3]
    given:
      - $.paths[*].parameters[*].in
      - $.paths[*][*].parameters[*].in
      - $.components.parameters.*.in
    then:
      function: pattern
      functionOptions:
        notMatch: "^cookie$"
