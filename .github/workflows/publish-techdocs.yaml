name: Build and publish TechDocs

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      deploy_location:
        description: "Publish to dev (DevHub Dev/Test) or prod (root and dev)"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      project:
        description: "TechDocs project to publish"
        required: true
        default: all
        type: choice
        options:
          - all
          - techdocs/api-style-guides
          - techdocs/sdx-api-standards
  push:
    branches: [test, main]
    paths:
      - "catalog-info.yaml"
      - "**/catalog-info.yaml"
      - "**/catalog-info.yml"
      - "**/mkdocs.yml"
      - "**/mkdocs.yaml"
      - "**/docs/**"
      - ".github/workflows/publish-techdocs.yaml"
      - ".github/scripts/stage-techdocs.sh"
  pull_request:
    branches: [test, main]
    paths:
      - "catalog-info.yaml"
      - "**/catalog-info.yaml"
      - "**/catalog-info.yml"
      - "**/mkdocs.yml"
      - "**/mkdocs.yaml"
      - "**/docs/**"
      - ".github/workflows/publish-techdocs.yaml"
      - ".github/scripts/stage-techdocs.sh"

jobs:
  techdocs:
    name: Build ${{ matrix.techdocs_directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        techdocs_directory: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.project != 'all' && format('["{0}"]', inputs.project) || '["techdocs/api-style-guides","techdocs/sdx-api-standards"]') }}
    # Production also writes to dev, so serialize all publishing for each project.
    concurrency:
      group: techdocs-${{ matrix.techdocs_directory }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
      cancel-in-progress: false
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stage TechDocs project
        env:
          TECHDOCS_DIRECTORY: ${{ matrix.techdocs_directory }}
        run: bash .github/scripts/stage-techdocs.sh

      - name: Validate pull request without publishing
        if: github.event_name == 'pull_request'
        uses: bcgov/devhub-techdocs-publish@stable
        with:
          publish: 'false'

      - name: Build and publish TechDocs
        if: github.event_name != 'pull_request'
        uses: bcgov/devhub-techdocs-publish@stable
        with:
          publish: 'true'
          # A manual destination takes precedence over the selected branch.
          production: ${{ ((github.event_name == 'workflow_dispatch' && inputs.deploy_location == 'prod') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'true' || 'false' }}
          bucket_name: ${{ secrets.TECHDOCS_S3_BUCKET_NAME }}
          s3_access_key_id: ${{ secrets.TECHDOCS_AWS_ACCESS_KEY_ID }}
          s3_secret_access_key: ${{ secrets.TECHDOCS_AWS_SECRET_ACCESS_KEY }}
          s3_region: ${{ secrets.TECHDOCS_AWS_REGION }}
          s3_endpoint: ${{ secrets.TECHDOCS_AWS_ENDPOINT }}
